name: CI — billing-service

# Gate de qualidade deste microsserviço: unit + integração (Postgres billing) + build.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-billing-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: billing-service
  NEW_RELIC_ENABLED: 'false'
  INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/billing

jobs:
  test:
    name: Testes + build (billing)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Testes unitários
        run: yarn test

      - name: Testes BDD (saga orçamento/pagamento)
        run: yarn test:bdd

      - name: Testes de integração (DB billing)
        run: yarn test:integration

      - name: Build
        run: yarn build

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate SonarCloud
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage (billing-service)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-service-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
